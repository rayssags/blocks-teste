<style>
/* ESTILO DA BARRA LATERAL */
.sidebar-about a {
    text-decoration: none;
}

.sidebar-image {
    margin-bottom: 0px; 
}

.sidebar-about h1 {
    font-size: 1.8rem;
    font-weight: 800;
    margin-top: 0;
    margin-bottom: 12px;
    color: #000000;
}

.sidebar-about .lead {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #000000; 
    margin-bottom: 40px;
}

/* ESTILO DO MENU */
.sidebar-nav {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 15px; 
}

.sidebar-nav a {
    display: block;
    color: #000000;
    font-size: 1.10rem; 
    font-weight: 500;
    letter-spacing: 0.5px;
    text-decoration: none;
    transition: all 0.2s ease-in-out;
}

.sidebar-nav a:hover {
    color: #e67e22; 
    transform: translateX(4px); 
}
</style>

<aside class="sidebar">
  <div class="container sidebar-sticky" style="display: flex; flex-direction: column;">
    
    <!-- BLOCO SUPERIOR -->
    <div>
        {{ with .Site.Params.sidebar_image }}
          <div class="sidebar-image">
            <a href="{{ $.Site.BaseURL }}"><img src="{{ . | relURL }}" alt="{{ $.Site.Title }}" /></a>
          </div>
        {{ end }}

        <div class="sidebar-about">
          <p class="lead">
          {{ with .Site.Params.description }} {{.}} {{ else }}An elegant open source and mobile first theme for <a href="http://hugo.spf13.com">hugo</a> made by <a href="http://twitter.com/mdo">@mdo</a>. Originally made for Jekyll.{{end}}
          </p>
        </div>

        <nav>
          <ul class="sidebar-nav">
            <li><a href="{{ .Site.BaseURL }}">Home</a> </li>
            {{ range .Site.Menus.main -}}
              <li><a href="{{.URL}}"> {{ .Name }} </a></li>
            {{- end }}
          </ul>
        </nav>
    </div>

    <div style="width: 100%; text-align: center; margin-top: 10px; padding-bottom: 20px;">
        
        <p style="font-size: 0.65rem; color: #000000; text-transform: uppercase; margin-bottom: 0px; letter-spacing: 2px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-left: auto; margin-right: auto; width: 80%;">
            Support
        </p>
        <div style="display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap; width: 100%; margin: 0 auto; padding: 0;">
            
            <img src="{{ "/images/capes.png" | relURL }}" alt="CAPES" 
                style="height: 60px; width: auto; object-fit: contain; opacity: 0.9; margin: 0;">

            <img src="{{ "/images/cnpq.png" | relURL }}" alt="CNPq" 
                style="height: 38px; width: auto; object-fit: contain; opacity: 0.9; margin: 0;">

            <img src="{{ "/images/faperj.png" | relURL }}" alt="FAPERJ" 
                style="height: 45px; width: auto; object-fit: contain; opacity: 0.9; margin: 0;">
        </div>
    </div>

  </div>
</aside>
